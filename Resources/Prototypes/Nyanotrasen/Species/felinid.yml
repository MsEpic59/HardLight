- type: species
  id: Felinid
  name: species-name-felinid
  roundStart: true
  prototype: MobFelinid
  sprites: MobHumanSprites
  markingLimits: MobFelinidMarkingLimits
  dollPrototype: MobFelinidDummy
  skinColoration: HumanToned

- type: markingPoints
  id: MobFelinidMarkingLimits
  points:
    Hair:
      points: 10 #HL 1<10
      required: false
    FacialHair:
      points: 10 #HL 1<10
      required: false
    Tail:
      points: 1 #HL 1<10
      required: true
      defaultMarkings: [ FelinidTailBasic ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ FelinidEarsBasic ]
    Chest:
      points: 10 # Frontier 1<4, HL 4<10
      required: false
    Legs:
      points: 10 # Frontier 2<8, HL 8<10
      required: false
    Arms:
      points: 10 # Frontier 2<8, HL 8<10
      required: false
    # Frontier: apparently these don't exist on Delta
    UndergarmentTop:
      points: 10 #HL 1<10
      required: false
    UndergarmentBottom:
      points: 10 #HL 1<10
      required: false
    # End Frontier
