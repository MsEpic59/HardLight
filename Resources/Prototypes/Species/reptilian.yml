- type: markingPoints
  id: MobReptilianMarkingLimits
  onlyWhitelisted: false
  points:
    Hair:
      points: 10 #HL modifcation
      required: false
    FacialHair:
      points: 10 #HL modifcation
      required: false
    Tail:
      points: 10 #HL modifcation
      required: true
      defaultMarkings: [ LizardTailSmooth ]
    Snout:
      points: 10 #HL modifcation
      required: true
      defaultMarkings: [ LizardSnoutRound ]
    HeadTop:
      points: 10 #HL modifcation
      required: false
    HeadSide:
      points: 10 #HL modifcation
      required: false
    UndergarmentTop:
      points: 10 #HL modifcation
      required: false
    UndergarmentBottom:
      points: 10 #HL modifcation
      required: false
    Chest:
      points: 10 #HL modifcation
      required: false
    Legs:
      points: 10 #HL modifcation
      required: false
    Arms:
      points: 10 #HL modifcation
      required: false

